name: Build & Auto-Deploy to GoDaddy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          NODE_ENV: production

      - name: Package Standalone Deployment Bundle
        run: |
          mkdir -p deploy_out
          # Copy standalone files including hidden .next
          cp -r .next/standalone/. deploy_out/
          # Copy static files into .next/static
          mkdir -p deploy_out/.next/static
          cp -r .next/static/* deploy_out/.next/static/
          # Copy public assets
          cp -r public deploy_out/
          
          # Inject Production Environment
          echo "NODE_ENV=production" > deploy_out/.env
          echo "PORT=3000" >> deploy_out/.env
          echo "MONGODB_URI=${{ secrets.MONGODB_URI || 'mongodb://websitegku_db_user:jHn2jiAGlPImDQXk@ac-jjzkgax-shard-00-00.a05gk60.mongodb.net:27017/gku_recruitment?ssl=true&authSource=admin&retryWrites=true&w=majority' }}" >> deploy_out/.env

          # Prepare zip package
          mkdir -p pkg_out
          cd deploy_out && zip -q -r ../pkg_out/gku-deploy.zip . && cd ..

          # Prepare webhook payload
          mkdir -p webhook_out
          cp deploy.php webhook_out/deploy.php
          # Also copy deploy.php to pkg_out
          cp deploy.php pkg_out/deploy.php

      - name: Upload Webhook Helper to public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        continue-on-error: true
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/
          local-dir: ./webhook_out/

      - name: Upload Single Deployment Package to Node App Directory
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /gku-recruitment-system.git/
          local-dir: ./pkg_out/

      - name: Trigger Server Extraction & Phusion Passenger Restart
        run: |
          echo "Triggering deployment webhook..."
          # Try primary temp domain endpoint
          RES1=$(curl -k -s "http://a7n.f1f.mytemp.website/deploy.php?token=gku_deploy_2026" || echo "failed")
          echo "Trigger Result (mytemp.website): $RES1"
          
          # If not yet extracted, try hrm.gku.ac.in directly
          if [[ "$RES1" != *"success"* ]]; then
            RES2=$(curl -k -s "https://hrm.gku.ac.in/deploy.php?token=gku_deploy_2026" || echo "failed")
            echo "Trigger Result (hrm.gku.ac.in): $RES2"
          fi
