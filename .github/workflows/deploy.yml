name: Build & Auto-Deploy to GoDaddy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          NODE_ENV: production

      - name: Package Standalone Deployment Bundle
        run: |
          mkdir -p deploy_out
          # Copy standalone files including hidden .next
          cp -r .next/standalone/. deploy_out/
          # Copy static files into .next/static
          mkdir -p deploy_out/.next/static
          cp -r .next/static/* deploy_out/.next/static/
          # Copy public assets
          cp -r public deploy_out/
          
          # Inject Production Environment
          echo "NODE_ENV=production" > deploy_out/.env
          echo "PORT=3000" >> deploy_out/.env
          echo "MONGODB_URI=${{ secrets.MONGODB_URI || 'mongodb://websitegku_db_user:jHn2jiAGlPImDQXk@ac-jjzkgax-shard-00-00.a05gk60.mongodb.net:27017/gku_recruitment?ssl=true&authSource=admin&retryWrites=true&w=majority' }}" >> deploy_out/.env

          # Prepare zip package
          mkdir -p pkg_out
          cd deploy_out && zip -q -r ../pkg_out/gku-deploy.zip . && cd ..

      - name: Fast Direct FTP Upload
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 -c "
          import os, sys
          from ftplib import FTP

          raw_server = os.environ.get('FTP_SERVER', '').strip()
          server = raw_server.replace('ftp://', '').replace('http://', '').replace('https://', '').strip('/')
          user = os.environ.get('FTP_USERNAME', '').strip()
          passwd = os.environ.get('FTP_PASSWORD', '').strip()

          print(f'Connecting to FTP: {server} as {user}...')
          ftp = FTP(server, timeout=120)
          ftp.login(user, passwd)
          print('Logged in successfully.')

          # Helper to safely navigate
          def enter_dir(target):
              for attempt in [target, target.strip('/'), '/' + target.strip('/')]:
                  try:
                      ftp.cwd(attempt)
                      return True
                  except Exception:
                      pass
              return False

          # 1. Upload deploy.php to public_html
          if enter_dir('public_html'):
              print('Entered public_html')
              with open('deploy.php', 'rb') as f:
                  ftp.storbinary('STOR deploy.php', f)
              print('deploy.php uploaded to public_html/deploy.php')
              ftp.cwd('..')

          # 2. Upload to gku-recruitment-system.git
          if enter_dir('gku-recruitment-system.git'):
              print('Entered gku-recruitment-system.git')
              print('Uploading gku-deploy.zip...')
              with open('pkg_out/gku-deploy.zip', 'rb') as f:
                  ftp.storbinary('STOR gku-deploy.zip', f)
              print('gku-deploy.zip uploaded successfully!')

              with open('deploy.php', 'rb') as f:
                  ftp.storbinary('STOR deploy.php', f)
              print('deploy.php uploaded to gku-recruitment-system.git')
          else:
              print('ERROR: Could not navigate to gku-recruitment-system.git directory!')
              sys.exit(1)

          ftp.quit()
          print('FTP upload completed successfully.')
          "

      - name: Trigger Server Extraction & Phusion Passenger Restart
        run: |
          echo "Triggering deployment webhook..."
          RES1=$(curl -k -s "http://a7n.f1f.mytemp.website/deploy.php?token=gku_deploy_2026")
          echo "Trigger Result: $RES1"
          
          if [[ "$RES1" != *"success"* ]]; then
            echo "Trying alternate trigger at hrm.gku.ac.in..."
            RES2=$(curl -k -s "https://hrm.gku.ac.in/deploy.php?token=gku_deploy_2026")
            echo "Alternate Result: $RES2"
          fi
